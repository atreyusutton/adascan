[project]
name = "adascan"
version = "0.1.0"
description = "ADA Title II accessibility scanning for US local government"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "selectolax>=0.3.21",
]

[project.optional-dependencies]
pdf = ["pikepdf>=9.0", "pymupdf>=1.24"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
adascan = "adascan.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/adascan"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
